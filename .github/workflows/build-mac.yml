name: Build Exambro Nusantara macOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run build:mac

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exambro-Nusantara-macOS-DMG
          path: dist/*.dmg